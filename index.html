

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #39FF14;
            --dark: #020617;
        }
        
        body {
            background: var(--dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        
        .bg-nexus {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(2, 6, 23, 0.94) 0%, rgba(2, 6, 23, 1) 100%), url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=1600');
            background-size: cover;
            z-index: -1;
        }
        
        .titulo-elite {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            color: var(--neon);
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -2px;
        }
        
        .logo-link {
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
            display: inline-block;
        }
        
        .logo-link:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px var(--neon));
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(57, 255, 20, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
        }
        
        .price-box {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 6rem;
            line-height: 1;
            color: #fff;
        }
        
        .btn-neon {
            background: var(--neon) !important;
            color: #000 !important;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            padding: 1.8rem;
            border-radius: 1rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.4);
            transition: 0.4s;
        }
        
        .btn-neon:hover {
            transform: scale(1.03);
            box-shadow: 0 0 80px var(--neon);
        }
        
        .img-premium {
            width: 100%;
            border-radius: 2rem;
            border: 3px solid var(--neon);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
        }
        
        .behance-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 1.5rem;
            border: 1px solid var(--neon);
            margin: 3rem 0;
        }
        
        .behance-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        @media (max-width: 600px) {
            .price-box {
                font-size: 3.5rem;
            }
            .btn-neon {
                font-size: 1.4rem;
            }
            .titulo-elite {
                font-size: 2.5rem !important;
            }
        }
    </style>

</head>
<body>
    <div class="bg-nexus"></div>
    
    <header class="flex justify-between items-center mb-20 max-w-6xl mx-auto p-6">
        <a href="index.html" class="logo-link titulo-elite text-4xl">NEXUS<span class="text-white">ALPHA</span></a>
        <div class="text-[10px] opacity-40 font-bold italic text-white uppercase tracking-widest">IA Active 2026</div>
    </header>
    
    
        <div class="text-center py-40">
            <h1 class="titulo-elite text-8xl md:text-[12rem] italic">NEXUS ALPHA</h1>
            <a href="ia-pro.html" class="btn-neon mx-auto max-w-sm px-10 mt-10">INICIAR</a>
        </div>
        
    
    <footer class="mt-40 py-20 border-t border-white/10 text-center">
        <div class="flex justify-center gap-10 mb-10 text-xs font-bold uppercase opacity-60">
            <a href="privacidade.html" class="text-white no-underline hover:text-green-500">Privacidade</a>
            <a href="termos.html" class="text-white no-underline hover:text-green-500">Termos de Uso</a>
        </div>
        <p class="text-[10px] opacity-20 uppercase font-bold tracking-widest">© 2026 Nexus Alpha System</p>
    </footer>
    
</body>
</html>
